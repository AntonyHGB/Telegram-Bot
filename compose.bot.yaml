# Merge with the ai-stack compose file (see README).
services:
  telegram-bot:
    environment:
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CACHE: /data/whisper
      ESTUDOS_PATH: /estudos
      DEALS_WINDOW_HOURS: ${DEALS_WINDOW_HOURS:-24}
      DEALS_TOP: ${DEALS_TOP:-5}
      DEALS_ALERT_PERCENT: ${DEALS_ALERT_PERCENT:-50}
      DEALS_JEV_RANKING: ${DEALS_JEV_RANKING:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13-free}
      JEV_TIMEOUT: ${JEV_TIMEOUT:-8}
      DEALS_HISTORY_RETENTION_DAYS: ${DEALS_HISTORY_RETENTION_DAYS:-90}
      DEALS_HISTORY_DEDUPE_HOURS: ${DEALS_HISTORY_DEDUPE_HOURS:-6}
      DEALS_HISTORY_MIN_SAMPLE: ${DEALS_HISTORY_MIN_SAMPLE:-5}
      DEALS_HISTORY_WINDOWS_DAYS: ${DEALS_HISTORY_WINDOWS_DAYS:-7,30,90}
      DEALS_HISTORY_CHEAP_PCT: ${DEALS_HISTORY_CHEAP_PCT:-20}
    volumes:
      - /home/antonio/Projetos/estudos:/estudos:ro
